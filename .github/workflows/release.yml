name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check release gate
        env:
          COMMIT: ${{ github.sha }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$COMMIT" origin/main

      - name: Set release variables
        env:
          TAG_NAME: ${{ github.ref_name }}
          BUILD_NO: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"
          echo "BUILD_NO=$BUILD_NO" >> "$GITHUB_ENV"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'

      - name: Format check
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Package
        run: make package VERSION="$VERSION" BUILD_NO="$BUILD_NO" RUN_ID="$RUN_ID" COMMIT="$COMMIT"

      - name: Verify package
        run: |
          PACKAGE=$(find dist -type f -name '*.tar.gz' -print -quit)
          BINARY=$(find dist -type f -not -name '*.tar.gz' -not -name '*.sha256' -not -name 'BUILD_INFO' -print -quit)
          sha256sum "$BINARY" "$PACKAGE"
          cat "$(find dist -type f -name BUILD_INFO -print -quit)"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PACKAGE=$(find dist -type f -name '*.tar.gz' -print -quit)
          CHECKSUM="${PACKAGE}.sha256"
          gh release create "$TAG_NAME" \
            "$PACKAGE" \
            "$CHECKSUM" \
            --title "$TAG_NAME" \
            --generate-notes

  image:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Release attachment
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p image-context
          gh release download "$TAG_NAME" --pattern '*.tar.gz' --dir image-context
          tar -xzf image-context/*.tar.gz -C image-context
          echo "VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"
          PKG_DIR=$(find image-context -mindepth 1 -maxdepth 1 -type d -print -quit)
          mv "$PKG_DIR" image-context/build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: image-context/build
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}
            SOURCE=https://github.com/${{ github.repository }}

      - name: Run image by digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "image=${IMAGE}@${DIGEST}"
          docker run -d --name enroll-conflict-o1 -p 18080:8080 "${IMAGE}@${DIGEST}"
          sleep 2
          curl --fail http://127.0.0.1:18080/version
          docker rm -f enroll-conflict-o1
